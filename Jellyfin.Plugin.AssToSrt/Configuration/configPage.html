                        singleLine: 'Unire le righe di un sottotitolo', singleLineHelp: 'Le battute che iniziano con un trattino restano separate.',
                        maxLine: 'Caratteri massimi per riga', maxLineHelp: 'Le righe lunghe vengono divise in righe equilibrate. 0: lasciare le righe come sono.',
                        minDuration: 'Durata minima a schermo', minDurationOff: 'Durata originale', minDurationHelp: 'I sottotitoli molto brevi restano un po\' di più, senza invadere il successivo.',
                        speakers: 'Mostrare il nome del personaggio', speakersHelp: '«Hitori: ...» quando il file indica il nome (frequente nei fansub).',
                        previewTitle: 'Anteprima (esempio):',
                        appearanceHelp: 'Contorno, ombra, carattere, dimensione e sfondo non possono essere salvati in un SRT: modificali nelle impostazioni dei sottotitoli della tua app Jellyfin.',
                        sample1: 'Live house Starry', sample2: 'Non ci credo che stasera', sample3: 'suoneremo sul palco...', sampleSong: 'Corro verso la luce',
                        realTitle: 'Anteprima e conversione di una serie', realHelp: 'Cerca una serie, un episodio o un film: guarda la conversione dei primi minuti con queste impostazioni (nulla viene salvato), oppure convertilo subito.',
                        search: 'Cerca', previewBtn: 'Anteprima', convertBtn: 'Converti ora',
                        previewLoading: 'Lettura dei sottotitoli (qualche secondo)...', previewNone: 'Nessun sottotitolo ASS in questo video.', previewError: 'L\'anteprima non è riuscita.',
                        original: 'ASS originale', converted: 'SRT convertito', queued: '{n} video aggiunti alla coda.',
                        Dialogue: 'dialogo', Sign: 'cartello', Song: 'canzone', Top: 'alto', Middle: 'centro', Bottom: 'basso', Left: 'sinistra', Center: 'centro', Right: 'destra',
                        hideTitle: 'Tracce ASS originali', hide: 'Nascondere le tracce ASS convertite (sperimentale)',
                        hideHelp: 'Rimuove dai menu le tracce ASS che hanno una copia SRT. I video non vengono modificati: deseleziona per mostrarle di nuovo. Possibile solo se le tracce ASS sono le ultime del file.',
                        namingTitle: 'Nome delle tracce', trackTitle: 'Usare il nome originale della traccia', trackTitleHelp: '"FR Full [ASS] - Crunchyroll" diventa "FR Full [SRT] - Crunchyroll". Jellyfin nasconde i nomi che contengono "forced".',
                        otherTitle: 'Altro', logActivity: 'Segnalare le conversioni nel registro attività di Jellyfin',
                        cleanup: 'Eliminare gli SRT dei video rimossi', cleanupHelp: 'Solo gli SRT creati da questo plugin.',
                        save: 'Salva', runNow: 'Salva e converti tutto ora', regenerate: 'Salva e rigenera gli SRT esistenti',
                        regenerateHelp: '«Rigenera» elimina gli SRT creati da questo plugin nelle librerie selezionate e li ricrea con queste impostazioni. I tuoi SRT non vengono mai toccati.',
                        started: 'Avviato. Segui l\'avanzamento in Dashboard > Attività pianificate.', failed: 'L\'azione non è riuscita.',
                        confirmRegenerate: 'Eliminare gli SRT creati da ASS to SRT e ricrearli con queste impostazioni?'
                    }
                };
                var lang = (document.documentElement.lang || navigator.language || 'en').toLowerCase().split('-')[0];
                if (!texts[lang]) { lang = 'en'; }
                var t = texts[lang];

                function format(text, values) {
                    return text.replace(/\{(\w+)\}/g, function (m, key) { return values[key] !== undefined ? values[key] : m; });
                }

                function escapeHtml(text) {
                    var div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                }

                // Shows SRT formatting (<i>, <b>, <u>, <font color>) without allowing anything else.
                function srtToHtml(line) {
                    return escapeHtml(line)
                        .replace(/&lt;(\/?)(i|b|u)&gt;/g, '<$1$2>')
                        .replace(/&lt;font color="(#[0-9a-fA-F]{6})"&gt;/g, '<span style="color:$1">')
                        .replace(/&lt;\/font&gt;/g, '</span>');
                }

                function time(ms) {
                    var s = Math.floor(ms / 1000);
                    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
                }

                function translate() {
                    page.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
                    page.querySelectorAll('[data-tlabel]').forEach(function (el) { el.setAttribute('label', t[el.getAttribute('data-tlabel')]); });
                    var hours = '';
                    for (var h = 0; h < 24; h++) { hours += '<option value="' + h + '">' + ('0' + h).slice(-2) + ':00</option>'; }
                    page.querySelectorAll('.atsHour').forEach(function (el) { el.innerHTML = hours; });
                }

                function value(id) {
                    var el = page.querySelector('#' + id);
                    return el.type === 'checkbox' ? el.checked : el.value;
                }

                function renderPreview() {
                    var o = function (id) { return value(id); };
                    var line1 = escapeHtml(t.sample2);
                    var line2 = escapeHtml(t.sample3);
                    if (o('KeepColors')) { line1 = '<span style="color:#ffd84d">' + line1 + '</span>'; }
                    if (o('KeepUnderline')) { line2 = '<u>' + line2 + '</u>'; }
                    var text = line1 + (o('SingleLine') ? ' ' : '<br>') + line2;
                    if (o('KeepItalic')) { text = '<i>' + text + '</i>'; }
                    if (o('KeepBold')) { text = '<b>' + text + '</b>'; }
                    var sign = escapeHtml(t.sample1.toUpperCase());
                    if (o('ColorSigns')) { sign = '<span style="color:' + o('SignColor') + '">' + sign + '</span>'; }
                    var song = '';
                    if (!o('RemoveSongs')) {
                        song = escapeHtml(t.sampleSong);
                        if (o('MarkSongs')) { song = '♪ ' + song + ' ♪'; if (o('KeepItalic')) { song = '<i>' + song + '</i>'; } }
                        song = '<div style="margin-top:.6em;opacity:.9">' + song + '</div>';
                    }
                    var top = '';
                    if (o('SignsMode') !== 'Remove') {
                        if (o('KeepPositions')) {
                            top = '<div style="margin-bottom:1.5em">' + sign + '</div>';
                        } else {
                            text = sign + '<br>' + text;
                        }
                    }
                    page.querySelector('#AssToSrtPreview').innerHTML = top + '<div>' + text + '</div>' + song;
                }

                function renderLastRun(config) {
                    var el = page.querySelector('#AssToSrtLastRun');
                    if (!config.LastRunUtc) {
                        el.textContent = t.lastRunNever;
                        return;
                    }

                    el.textContent = format(t.lastRun, {
                        date: new Date(config.LastRunUtc).toLocaleString(lang),
                        libraries: config.LastRunLibraries || t.lastRunNoLibrary,
                        checked: config.LastRunChecked, converted: config.LastRunConverted,
                        created: config.LastRunCreated, errors: config.LastRunErrors
                    });
                }

                function renderStats() {
                    ApiClient.getJSON(ApiClient.getUrl('AssToSrt/Stats')).then(function (s) {
                        var size = s.SizeBytes > 1048576 ? (s.SizeBytes / 1048576).toFixed(1) + ' Mo' : Math.round(s.SizeBytes / 1024) + ' Ko';
                        if (lang !== 'fr') { size = size.replace('Mo', 'MB').replace('Ko', 'KB'); }
                        page.querySelector('#AssToSrtStats').textContent = format(t.stats, { srt: s.SrtFiles, videos: s.Videos, size: size, hidden: s.HiddenVideos, queued: s.Queued });
                    }).catch(function () { page.querySelector('#AssToSrtStats').style.display = 'none'; });
                }

                function renderLibraries(folders, selected) {
                    page.querySelector('#AssToSrtLibraries').innerHTML = folders
                        .filter(function (f) { return videoTypes.indexOf(f.CollectionType) !== -1; })
                        .map(function (f) {
                            var checked = selected.indexOf(f.ItemId) !== -1 ? ' checked' : '';
                            return '<div class="checkboxContainer"><label class="emby-checkbox-label"><input is="emby-checkbox" type="checkbox" class="assToSrtLibrary" data-id="'
                                + f.ItemId + '"' + checked + ' /><span>' + escapeHtml(f.Name) + '</span></label></div>';
                        }).join('');
                }

                function readForm(config) {
                    checkboxes.forEach(function (id) { config[id] = page.querySelector('#' + id).checked; });
                    selects.forEach(function (id) { config[id] = page.querySelector('#' + id).value; });
                    ['WindowStartHour', 'WindowEndHour', 'MinDurationMs'].forEach(function (id) { config[id] = parseInt(config[id], 10) || 0; });
                    numbers.forEach(function (id) { config[id] = Math.max(0, parseInt(page.querySelector('#' + id).value, 10) || 0); });
                    config.Languages = page.querySelector('#Languages').value.trim();
                    config.SignColor = page.querySelector('#SignColor').value;
                    config.LibraryIds = Array.prototype.map.call(page.querySelectorAll('.assToSrtLibrary:checked'), function (el) { return el.getAttribute('data-id'); });
                    return config;
                }

                function save() {
                    Dashboard.showLoadingMsg();
                    return ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        return ApiClient.updatePluginConfiguration(pluginId, readForm(config));
                    });
                }

                function post(path, data) {
                    return ApiClient.ajax({
                        type: 'POST',
                        url: ApiClient.getUrl(path),
                        data: data ? JSON.stringify(data) : undefined,
                        contentType: 'application/json',
                        dataType: data ? 'json' : undefined
                    });
                }

                function action(path) {
                    save().then(function () { return post(path); }).then(function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert(t.started);
                    }).catch(function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert(t.failed);
                    });
                }

                // --- Real preview and series conversion ---
                var searchTimer = null;
                function search(term) {
                    var results = page.querySelector('#AssToSrtResults');
                    if (term.length < 2) { results.innerHTML = ''; return; }
                    ApiClient.getItems(ApiClient.getCurrentUserId(), { searchTerm: term, IncludeItemTypes: 'Series,Movie,Episode', Recursive: true, Limit: 12 }).then(function (r) {
                        results.innerHTML = r.Items.map(function (i) {
                            var label = i.Type === 'Episode' ? (i.SeriesName + ' — ' + (i.ParentIndexNumber ? 'S' + i.ParentIndexNumber : '') + 'E' + (i.IndexNumber || '?') + ' ' + i.Name) : i.Name + (i.ProductionYear ? ' (' + i.ProductionYear + ')' : '');
                            return '<button is="emby-button" type="button" class="raised emby-button atsResult" data-id="' + i.Id + '" data-type="' + i.Type + '">' + escapeHtml(label) + '</button>';
                        }).join('');
                    });
                }

                function selectItem(id, type, label) {
                    selectedItem = { id: id, type: type };
                    var box = page.querySelector('#AssToSrtSelected');
                    box.style.display = '';
                    box.textContent = label;
                    page.querySelector('#AssToSrtPreviewBtn').disabled = false;
                    page.querySelector('#AssToSrtConvertBtn').disabled = false;
                    page.querySelector('#AssToSrtResults').innerHTML = '';
                }

                function previewVideoId() {
                    if (selectedItem.type !== 'Series') { return Promise.resolve(selectedItem.id); }
                    return ApiClient.getJSON(ApiClient.getUrl('Shows/' + selectedItem.id + '/Episodes', { userId: ApiClient.getCurrentUserId(), Limit: 1 })).then(function (r) {
                        return r.Items.length ? r.Items[0].Id : selectedItem.id;
                    });
                }

                function renderRealPreview(tracks) {
                    var label = function (row, column) { return t[row] + (column !== 'Center' ? ' ' + t[column] : ''); };
                    page.querySelector('#AssToSrtRealPreview').innerHTML = tracks.map(function (track) {
                        var original = track.Original.map(function (l) {
                            return '<div class="ats-item"><span class="ats-time">' + time(l.Start) + '</span><span class="ats-tag">' + t[l.Kind] + '</span><span class="ats-tag">' + label(l.Row, l.Column) + '</span>' + escapeHtml(l.Text) + '</div>';
                        }).join('');
                        var converted = track.Converted.map(function (c) {
                            return '<div class="ats-item"><span class="ats-time">' + time(c.Start) + '–' + time(c.End) + '</span><span class="ats-tag">' + label(c.Row, c.Column) + '</span>'
                                + '<div class="ats-cue" style="text-align:' + (c.Column === 'Left' ? 'left' : c.Column === 'Right' ? 'right' : 'center') + '">' + c.Lines.map(srtToHtml).join('<br>') + '</div></div>';
                        }).join('');
                        return '<h4>' + escapeHtml(track.Title) + '</h4><div class="ats-cols"><div><b>' + t.original + '</b><div class="ats-list">' + original + '</div></div>'
                            + '<div><b>' + t.converted + '</b><div class="ats-list">' + converted + '</div></div></div>';
                    }).join('');
                }

                translate();

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    Promise.all([ApiClient.getPluginConfiguration(pluginId), ApiClient.getVirtualFolders()]).then(function (results) {
                        var config = results[0];
                        checkboxes.forEach(function (id) { page.querySelector('#' + id).checked = !!config[id]; });
                        selects.forEach(function (id) { if (config[id] !== undefined && config[id] !== null) { page.querySelector('#' + id).value = String(config[id]); } });
                        numbers.forEach(function (id) { page.querySelector('#' + id).value = config[id]; });
                        page.querySelector('#Languages').value = config.Languages || '';
                        page.querySelector('#SignColor').value = config.SignColor || '#ffe066';
                        renderLibraries(results[1], config.LibraryIds || []);
                        renderLastRun(config);
                        renderStats();
                        renderPreview();
                        Dashboard.hideLoadingMsg();
                    });
                });

                page.querySelectorAll('.atsStyle').forEach(function (el) {
                    el.addEventListener('change', renderPreview);
                    el.addEventListener('input', renderPreview);
                });

                page.querySelector('#AssToSrtSearch').addEventListener('input', function (e) {
                    clearTimeout(searchTimer);
                    var term = e.target.value.trim();
                    searchTimer = setTimeout(function () { search(term); }, 300);
                });

                page.querySelector('#AssToSrtResults').addEventListener('click', function (e) {
                    var button = e.target.closest('.atsResult');
                    if (button) { selectItem(button.getAttribute('data-id'), button.getAttribute('data-type'), button.textContent); }
                });

                page.querySelector('#AssToSrtPreviewBtn').addEventListener('click', function () {
                    var target = page.querySelector('#AssToSrtRealPreview');
                    target.textContent = t.previewLoading;
                    previewVideoId().then(function (id) {
                        return post('AssToSrt/Preview', { ItemId: id, Settings: readForm({}) });
                    }).then(function (tracks) {
                        renderRealPreview(tracks);
                    }).catch(function (e) {
                        target.textContent = e && e.status === 404 ? t.previewNone : t.previewError;
                    });
                });

                page.querySelector('#AssToSrtConvertBtn').addEventListener('click', function () {
                    save().then(function () {
                        return post('AssToSrt/Convert/' + selectedItem.id, {});
                    }).then(function (count) {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert(format(t.queued, { n: count }));
                        renderStats();
                    }).catch(function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert(t.failed);
                    });
                });

                page.querySelector('#AssToSrtConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    save().then(Dashboard.processPluginConfigurationUpdateResult);
                    return false;
                });

                page.querySelector('#AssToSrtRunNow').addEventListener('click', function () { action('AssToSrt/ConvertAll'); });

                page.querySelector('#AssToSrtRegenerate').addEventListener('click', function () {
                    if (window.confirm(t.confirmRegenerate)) { action('AssToSrt/Regenerate'); }
                });
            })();
        </script>
    </div>
</body>
</html>
